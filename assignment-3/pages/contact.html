<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>التواصل</title>
</head>

<body>
    <header>
        <p>أكاديمية الويب</p>
        <nav aria-label="التنقل الرئيسي">
            <a href="index.html">الرئيسية</a>
            <a href="courses.html">الدورات</a>
            <a href="contact.html">التواصل</a>
        </nav>
    </header>
    <main>
        <h1>استفسار عن دورة</h1>
        <form>
            <fieldset>
                <legend>استفسار عن دورة</legend>
                <p>
                    <label for="full-name">الاسم الكامل (مطلوب، حرفان على الأقل)</label><br>
                    <input id="full-name" name="fullName" type="text" required minlength="2" autocomplete="name">
                </p>
                <p>
                    <label for="email">البريد الإلكتروني (مطلوب)</label><br>
                    <input id="email" name="email" type="email" required autocomplete="email">
                </p>
                <p>
                    <label for="course">الدورة (مطلوبة)</label><br>
                    <select id="course" name="course" required>
                        <option value="">اختر دورة</option>
                        <option value="html">دورة HTML</option>
                        <option value="css">دورة CSS</option>
                    </select>
                </p>
                <p>
                    <label for="message">رسالتك (مطلوبة، من 10 إلى 200 حرف)</label><br>
                    <textarea id="message" name="message" rows="4" required minlength="10" maxlength="200"></textarea>
                </p>
                <p id="message-help">اكتب سؤالك بوضوح، بدون بيانات دفع.</p>
                <button type="submit">افحص الاستفسار التجريبي</button>
            </fieldset>
        </form>
        <p>نموذج تدريبي محلي يعرض القيم فقط. لا يرسل استفسارًا ولا يحفظ تسجيلًا. استخدم بيانات وهمية.</p>
        <pre id="demo-result" role="status"></pre>
        <script>
            document.querySelector('form').addEventListener('submit', function (event) {
                event.preventDefault();
                document.getElementById('demo-result').textContent = 'بيانات تجريبية محلية:\n' + JSON.stringify(Array.from(new FormData(this).entries()), null, 2);
            });
        </script>
    </main>
    <footer>
        <p>مشروع تدريبي لتعلم HTML.</p>
    </footer>
</body>

</html>
